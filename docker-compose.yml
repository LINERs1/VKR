version: '3.8'

services:
  platform_backend:
    build: ./platform_service/backend
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - AI_SERVICE_URL=http://ai_service:8000
      - SERVICE_API_KEY=${SERVICE_API_KEY:-}
    env_file:
      - ./platform_service/backend/.env
    volumes:
      - ./platform_service/backend/platform.db:/app/platform.db

  ai_service:
    build: ./ai_service
    ports:
      - "8000:8000"
    environment:
      - PLATFORM_SERVICE_URL=http://platform_backend:8001
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SERVICE_API_KEY=${SERVICE_API_KEY:-}
    env_file:
      - ./ai_service/.env
    volumes:
      - ./ai_service/app.db:/app/app.db
      - ./ai_service/chroma_db:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - platform_backend
      - ai_service
